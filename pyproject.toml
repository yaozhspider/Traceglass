[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceglass"
version = "0.2.0"
description = "Evidence-driven reverse engineering analysis workbench"
requires-python = ">=3.11"
dependencies = [
  "agentscope[service,storage-sql]==2.0.6",
  "aiosqlite>=0.20,<1",
  "httpx[socks]>=0.27,<1",
  "python-multipart>=0.0.18,<1",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "aiodocker>=0.24,<1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
]

[project.scripts]
traceglass = "traceglass.api.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
traceglass = ["resources/skills/**/*", "resources/skill-sources.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
